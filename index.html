<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Typography: Cairo for headings/subheadings/links, Tajawal for body -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700&display=swap"
    rel="stylesheet"
  />
  <title>منشورات برقية — أرشيفك عبر تيليغرام</title>
  <script>
    // Restore saved language + theme before first paint to avoid flashing.
    // Arabic is the default language; English is an explicit opt-out.
    (function () {
      try {
        var lang = localStorage.getItem("barq-lang");
        if (lang === "en") {
          document.documentElement.lang = "en";
          document.documentElement.dir = "ltr";
        } else {
          document.documentElement.lang = "ar";
          document.documentElement.dir = "rtl";
        }
        var theme = localStorage.getItem("barq-theme");
        if (
          theme === "dark" ||
          (!theme && window.matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    })();
  </script>
</head>


<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
